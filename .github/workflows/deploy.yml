name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tools/docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            image: sxgerador-api
            dockerfile: apps/api/Dockerfile
          - app: web
            image: sxgerador-web
            dockerfile: apps/web/Dockerfile
          - app: docs
            image: sxgerador-docs
            dockerfile: apps/docs/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          echo "tags=${REGISTRY}/${IMAGE_OWNER}/${IMAGE}:latest,${REGISTRY}/${IMAGE_OWNER}/${IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sxgerador
            git fetch --depth=1 origin main
            git reset --hard origin/main
            docker compose -f tools/docker/docker-compose.prod.yml --env-file .env.production pull
            docker compose -f tools/docker/docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            docker image prune -f
