name: sxgerador-prod

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - sxg

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sxg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/sxgerador/sxgerador-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - sxg
    labels:
      - traefik.enable=true
      - traefik.docker.network=sxgerador-prod_sxg
      - traefik.http.routers.api.rule=Host(`api.${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3000
    command: ['sh', '-c', 'pnpm --filter api prisma migrate deploy && node apps/api/dist/index.js']

  web:
    image: ${WEB_IMAGE:-ghcr.io/sxgerador/sxgerador-web:latest}
    restart: unless-stopped
    networks:
      - sxg
    labels:
      - traefik.enable=true
      - traefik.docker.network=sxgerador-prod_sxg
      - traefik.http.routers.web.rule=Host(`${PUBLIC_DOMAIN}`) || Host(`www.${PUBLIC_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80

  docs:
    image: ${DOCS_IMAGE:-ghcr.io/sxgerador/sxgerador-docs:latest}
    restart: unless-stopped
    networks:
      - sxg
    labels:
      - traefik.enable=true
      - traefik.docker.network=sxgerador-prod_sxg
      - traefik.http.routers.docs.rule=Host(`docs.${PUBLIC_DOMAIN}`)
      - traefik.http.routers.docs.entrypoints=websecure
      - traefik.http.routers.docs.tls.certresolver=letsencrypt
      - traefik.http.services.docs.loadbalancer.server.port=80

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ../scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    entrypoint: ['sh', '-c']
    command:
      - |
        echo "0 3 * * * /usr/local/bin/backup-postgres.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    networks:
      - sxg

networks:
  sxg:

volumes:
  postgres-data:
  letsencrypt:
