<section class="sxg-indexes-list">
  <div class="sxg-indexes-list__toolbar">
    <po-input
      p-placeholder="Buscar por chave, descrição ou apelido"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
    ></po-input>
    <po-button
      p-label="Novo índice"
      p-kind="primary"
      p-icon="an an-plus"
      [p-disabled]="isDisabled()"
      (p-click)="goToNew()"
    ></po-button>
  </div>

  @if (isLoading()) {
    <sxg-loading-skeleton variant="table" [rows]="3" />
  } @else if (rows.length === 0) {
    <sxg-empty-state
      icon="an an-list-magnifying-glass"
      title="Nenhum índice cadastrado"
      description="Cadastre os índices SIX para definir as chaves de navegação da tabela."
      [actionLabel]="isDisabled() ? null : 'Novo índice'"
      actionIcon="an an-plus"
      (action)="goToNew()"
    />
  } @else {
    <po-table
      [p-columns]="columns"
      [p-items]="rows"
      [p-actions]="actions"
      [p-striped]="true"
    ></po-table>
  }
</section>
