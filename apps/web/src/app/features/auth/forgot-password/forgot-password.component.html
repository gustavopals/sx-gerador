<po-page-background p-product-name="SXGerador" p-environment="beta">
  <div class="sxg-forgot">
    @if (!sent()) {
      <h2 class="po-font-title sxg-forgot__title">Recuperar senha</h2>
      <p class="po-font-text-small sxg-forgot__sub">
        Informe seu e-mail e enviaremos um link para criar uma nova senha.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <po-input
          p-label="E-mail"
          p-type="email"
          formControlName="email"
          p-placeholder="seu@email.com"
          [p-error-pattern]="emailError"
          p-required="true"
        ></po-input>

        <po-button
          class="sxg-forgot__submit"
          p-label="Enviar link"
          [p-type]="submitType"
          p-kind="primary"
          [p-loading]="loading()"
          [p-disabled]="loading()"
        ></po-button>
      </form>
    } @else {
      <div class="sxg-forgot__icon" aria-hidden="true">
        <span class="po-icon an an-envelope-open"></span>
      </div>
      <h2 class="po-font-title sxg-forgot__title">Confira seu e-mail</h2>
      <p class="po-font-text sxg-forgot__body">
        Se o endereço estiver cadastrado, você receberá um link de redefinição em instantes.
      </p>
      <po-button routerLink="/login" p-label="Voltar ao login" p-kind="secondary"></po-button>
    }

    @if (!sent()) {
      <p class="po-font-text-small sxg-forgot__footer">
        Lembrou a senha? <a routerLink="/login" class="sxg-forgot__link">Entrar</a>
      </p>
    }
  </div>
</po-page-background>
