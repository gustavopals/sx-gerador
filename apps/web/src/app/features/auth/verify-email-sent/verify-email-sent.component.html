<po-page-background p-product-name="SXGerador" p-environment="beta">
  <div class="sxg-verify">
    <div class="sxg-verify__icon">
      <span class="an an-envelope-open po-icon"></span>
    </div>

    <h2 class="po-font-title sxg-verify__title">Verifique seu e-mail</h2>

    <p class="po-font-text sxg-verify__body">
      Enviamos um link de confirmação para o endereço informado. Acesse sua caixa de entrada e
      clique no link para ativar sua conta.
    </p>

    <p class="po-font-text-small sxg-verify__hint">
      Não recebeu? Verifique a pasta de spam ou
      <a routerLink="/signup" class="sxg-verify__link">tente novamente</a>.
    </p>

    <po-button routerLink="/login" p-label="Ir para o login" p-kind="secondary"></po-button>
  </div>
</po-page-background>
